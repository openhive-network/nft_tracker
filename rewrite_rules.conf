rewrite ^/nfts /rpc/get_nft_types break;
# endpoint for get /nfts

rewrite ^/nfts/([^/]+)/([^/]+) /rpc/get_nft_instances?creator=$1&symbol=$2 break;
# endpoint for get /nfts/{creator}/{symbol}

rewrite ^/version /rpc/get_version break;
# endpoint for get /version

rewrite ^/$ / break;
# endpoint for openapi spec itself

rewrite ^/(.*)$ /rpc/$1 break;
# default endpoint for everything else
