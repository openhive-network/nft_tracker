stages:
- build
- publish

variables:
  # Docker image tags - use 'latest' for stable images from common-ci-configuration
  DOCKER_BUILDER_TAG: "latest"
  DOCKER_DIND_TAG: "latest"
  IMAGE_REMOVER_TAG: "latest"
  # common-ci-configuration reference for fetching scripts
  COMMON_CI_REF: "develop"
  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
- project: 'hive/common-ci-configuration'
  ref: develop
  file:
  - '/templates/base.gitlab-ci.yml'
  - '/templates/docker_image_jobs.gitlab-ci.yml'

default:
  hooks:
    pre_get_sources_script: !reference [.pre_get_sources_simple, pre_get_sources_script]

build_images:
  extends: .docker_image_builder_job_template
  stage: build
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    # Build and push main image (docker-bake handles tagging: short SHA + latest on develop + version on tags)
    $CI_PROJECT_DIR/scripts/ci-helpers/build_instance.sh \
      "$CI_COMMIT_SHORT_SHA" \
      "$CI_PROJECT_DIR" \
      "$CI_REGISTRY_IMAGE"

    # Build rewriter image tags
    REWRITER_TAGS="--tag $CI_REGISTRY_IMAGE/postgrest-rewriter:$CI_COMMIT_SHORT_SHA"

    # Tag with 'latest' on develop branch
    if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
      REWRITER_TAGS="$REWRITER_TAGS --tag $CI_REGISTRY_IMAGE/postgrest-rewriter:latest"
    fi

    # Tag with version on protected tags
    REWRITER_TARGET="without_tag"
    if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
      REWRITER_TARGET="with_tag"
      REWRITER_TAGS="$REWRITER_TAGS --tag $CI_REGISTRY_IMAGE/postgrest-rewriter:$CI_COMMIT_TAG"
    fi

    # Build and push the rewriter image
    # shellcheck disable=SC2086
    docker buildx build \
      --build-arg BUILD_TIME="$(date -uIseconds)" \
      --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA" \
      --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_BRANCH" \
      --build-arg GIT_LAST_LOG_MESSAGE="$(git log -1 --pretty=%B)" \
      --build-arg GIT_LAST_COMMITTER="$(git log -1 --pretty='%an <%ae>')" \
      --build-arg GIT_LAST_COMMIT_DATE="$(git log -1 --pretty='%aI')" \
      ${CI_COMMIT_TAG:+--build-arg GIT_COMMIT_TAG=$CI_COMMIT_TAG} \
      --target=$REWRITER_TARGET \
      $REWRITER_TAGS \
      --push \
      -f Dockerfile.rewriter .
  tags:
  - standard
  - public-runner-docker

# Publish to registry.hive.blog - pull/retag/push only, no rebuild
publish_images:
  extends: .docker_publish_job_template
  variables:
    PUBLISH_IMAGES: "nft_tracker postgrest-rewriter"
  tags:
  - standard
  - public-runner-docker
