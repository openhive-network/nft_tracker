stages:
- build
- publish

variables:
  # Docker image tags - use 'latest' for stable images from common-ci-configuration
  DOCKER_BUILDER_TAG: "latest"
  DOCKER_DIND_TAG: "latest"
  IMAGE_REMOVER_TAG: "latest"
  # common-ci-configuration reference for fetching scripts
  COMMON_CI_REF: "develop"
  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
- project: 'hive/common-ci-configuration'
  ref: 0a1e1a9d53d6b1c8ae1bdc652e19740134a359b4
  file:
  - '/templates/base.gitlab-ci.yml'
  - '/templates/docker_image_jobs.gitlab-ci.yml'

default:
  hooks:
    pre_get_sources_script: !reference [.pre_get_sources_simple, pre_get_sources_script]

build_images:
  extends: .docker_image_builder_job_template
  stage: build
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    # Build and push with commit SHA tag (this creates all three tags for GitLab registry)
    $CI_PROJECT_DIR/scripts/ci-helpers/build_instance.sh \
      "$CI_COMMIT_SHORT_SHA" \
      "$CI_PROJECT_DIR" \
      "$CI_REGISTRY_IMAGE"

    # Build and push the rewriter image
    docker build -t "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:$CI_COMMIT_SHORT_SHA" \
      -f Dockerfile.rewriter \
      --build-arg BUILD_TIME="$(date -uIseconds)" \
      --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA" \
      --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_BRANCH" \
      --build-arg GIT_LAST_LOG_MESSAGE="$(git log -1 --pretty=%B)" \
      --build-arg GIT_LAST_COMMITTER="$(git log -1 --pretty='%an <%ae>')" \
      --build-arg GIT_LAST_COMMIT_DATE="$(git log -1 --pretty='%aI')" \
      .
    docker push "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:$CI_COMMIT_SHORT_SHA"

    # If on develop branch, also tag and push as 'develop'
    if [[ "$CI_COMMIT_BRANCH" == "develop" ]]; then
      echo "Tagging images with 'develop' tag..."
      docker tag "registry.gitlab.syncad.com/hive/nft_tracker:$CI_COMMIT_SHORT_SHA" "registry.gitlab.syncad.com/hive/nft_tracker:develop"
      docker tag "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:$CI_COMMIT_SHORT_SHA" "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:develop"
      docker push "registry.gitlab.syncad.com/hive/nft_tracker:develop"
      docker push "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:develop"
    fi
  tags:
  - public-runner-docker

publish_release_images:
  extends: .docker_image_builder_job_template
  stage: publish
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registries..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo "$BLOG_REGISTRY_PASSWORD" | docker login --username "$BLOG_REGISTRY_USER" --password-stdin registry-upload.hive.blog
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    echo "Publishing release images for tag: $CI_COMMIT_TAG"

    # Build images with release tag for GitLab registry (creates all three tags)
    $CI_PROJECT_DIR/scripts/ci-helpers/build_instance.sh \
      "$CI_COMMIT_TAG" \
      "$CI_PROJECT_DIR" \
      "$CI_REGISTRY_IMAGE"

    # Build and push the rewriter image with release tag
    docker build -t "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:$CI_COMMIT_TAG" \
      -f Dockerfile.rewriter \
      --target with_tag \
      --build-arg BUILD_TIME="$(date -uIseconds)" \
      --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA" \
      --build-arg GIT_CURRENT_BRANCH="$CI_COMMIT_BRANCH" \
      --build-arg GIT_LAST_LOG_MESSAGE="$(git log -1 --pretty=%B)" \
      --build-arg GIT_LAST_COMMITTER="$(git log -1 --pretty='%an <%ae>')" \
      --build-arg GIT_LAST_COMMIT_DATE="$(git log -1 --pretty='%aI')" \
      --build-arg GIT_COMMIT_TAG="$CI_COMMIT_TAG" \
      .
    docker push "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:$CI_COMMIT_TAG"

    # Push only the main images to registry-upload.hive.blog
    docker tag "registry.gitlab.syncad.com/hive/nft_tracker:$CI_COMMIT_TAG" "registry-upload.hive.blog/nft_tracker:$CI_COMMIT_TAG"
    docker tag "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:$CI_COMMIT_TAG" "registry-upload.hive.blog/nft_tracker/postgrest-rewriter:$CI_COMMIT_TAG"
    docker push "registry-upload.hive.blog/nft_tracker:$CI_COMMIT_TAG"
    docker push "registry-upload.hive.blog/nft_tracker/postgrest-rewriter:$CI_COMMIT_TAG"

    # Also tag with 'latest' if this is a release tag
    docker tag "registry.gitlab.syncad.com/hive/nft_tracker:$CI_COMMIT_TAG" "registry.gitlab.syncad.com/hive/nft_tracker:latest"
    docker tag "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:$CI_COMMIT_TAG" "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:latest"
    docker tag "registry.gitlab.syncad.com/hive/nft_tracker:$CI_COMMIT_TAG" "registry-upload.hive.blog/nft_tracker:latest"
    docker tag "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:$CI_COMMIT_TAG" "registry-upload.hive.blog/nft_tracker/postgrest-rewriter:latest"
    docker push "registry.gitlab.syncad.com/hive/nft_tracker:latest"
    docker push "registry.gitlab.syncad.com/hive/nft_tracker/postgrest-rewriter:latest"
    docker push "registry-upload.hive.blog/nft_tracker:latest"
    docker push "registry-upload.hive.blog/nft_tracker/postgrest-rewriter:latest"

    echo "Successfully published release images with tag: $CI_COMMIT_TAG"
  rules:
  - if: '$CI_COMMIT_TAG =~ /^v[0-9]+.*/ && $CI_COMMIT_REF_PROTECTED == "true"'
    when: on_success
  - if: '$CI_COMMIT_TAG =~ /^[0-9]+.*/ && $CI_COMMIT_REF_PROTECTED == "true"'
    when: on_success
  - when: never
  tags:
  - public-runner-docker
