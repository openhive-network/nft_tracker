stages:
- build
- test
- publish

variables:
  # Docker image tags - use 'latest' for stable images from common-ci-configuration
  DOCKER_BUILDER_TAG: "latest"
  DOCKER_DIND_TAG: "latest"
  IMAGE_REMOVER_TAG: "latest"
  # HAF image for regression tests.
  # Pin to a specific version for reproducible CI. Update when HAF
  # releases schema changes that affect nfttracker (check HAF changelog).
  HAF_REGISTRY: "registry.gitlab.syncad.com/hive/haf"
  HAF_VERSION: "1.28.6-rc5"
  # common-ci-configuration reference for fetching scripts
  COMMON_CI_REF: "develop"
  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
- project: 'hive/common-ci-configuration'
  ref: develop
  file:
  - '/templates/base.gitlab-ci.yml'
  - '/templates/docker_image_jobs.gitlab-ci.yml'

default:
  hooks:
    pre_get_sources_script: !reference [.pre_get_sources_simple, pre_get_sources_script]

build_images:
  extends: .docker_image_builder_job_template
  stage: build
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    # Build and push main image (docker-bake.hcl full-ci handles all tagging:
    #   always: $CI_COMMIT_SHORT_SHA
    #   develop branch: latest
    #   protected tags: $CI_COMMIT_TAG)
    $CI_PROJECT_DIR/scripts/ci-helpers/build_instance.sh \
      "$CI_COMMIT_SHORT_SHA" \
      "$CI_PROJECT_DIR" \
      "$CI_REGISTRY_IMAGE"

    # Build the rewriter image
    # Select Dockerfile target: with_tag adds version label, without_tag is default
    if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
      REWRITER_TARGET="with_tag"
    else
      REWRITER_TARGET="without_tag"
    fi

    REWRITER_IMAGE="${CI_REGISTRY_IMAGE}/postgrest-rewriter"

    docker build \
      -t "${REWRITER_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
      ${CI_COMMIT_TAG:+-t "${REWRITER_IMAGE}:${CI_COMMIT_TAG}"} \
      -f Dockerfile.rewriter \
      --target "${REWRITER_TARGET}" \
      --build-arg BUILD_TIME="$(date -uIseconds)" \
      --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA" \
      --build-arg GIT_CURRENT_BRANCH="${CI_COMMIT_BRANCH:-}" \
      --build-arg GIT_LAST_LOG_MESSAGE="$(git log -1 --pretty=%B)" \
      --build-arg GIT_LAST_COMMITTER="$(git log -1 --pretty='%an <%ae>')" \
      --build-arg GIT_LAST_COMMIT_DATE="$(git log -1 --pretty='%aI')" \
      ${CI_COMMIT_TAG:+--build-arg GIT_COMMIT_TAG="$CI_COMMIT_TAG"} \
      .
    docker push "${REWRITER_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
      docker push "${REWRITER_IMAGE}:${CI_COMMIT_TAG}"
    fi
    # publish_images job handles latest/version tagging via the publish template
  tags:
  - public-runner-docker

regression_tests:
  extends: .docker_image_builder_job_template
  stage: test
  timeout: 15 minutes
  needs:
  - build_images
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    # Clean up stale resources from previous runs (runner reuse)
    docker rm -f haf 2>/dev/null || true
    docker network rm nft-test-net 2>/dev/null || true

    echo -e "\e[0Ksection_start:$(date +%s):pull[collapsed=true]\r\e[0KPulling test image..."
    # Test image = HAF + postgresql-server-dev + make (for pg_regress).
    # Built once per HAF_VERSION and cached in the registry.
    HAF_TEST_IMAGE="${CI_REGISTRY_IMAGE}/haf-test:${HAF_VERSION}"
    if ! docker pull "${HAF_TEST_IMAGE}" 2>/dev/null; then
      echo "Test image not found, building..."
      docker build \
        -t "${HAF_TEST_IMAGE}" \
        --build-arg "HAF_IMAGE=${HAF_REGISTRY}:${HAF_VERSION}" \
        -f docker/Dockerfile.test .
      docker push "${HAF_TEST_IMAGE}"
    fi

    docker pull "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    echo -e "\e[0Ksection_end:$(date +%s):pull\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):network[collapsed=true]\r\e[0KCreating Docker network..."
    docker network create nft-test-net
    echo -e "\e[0Ksection_end:$(date +%s):network\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):haf[collapsed=true]\r\e[0KStarting HAF (PostgreSQL only)..."
    docker run -d \
      --name haf \
      --network nft-test-net \
      -e DATADIR=/home/hived/datadir \
      -e SHM_DIR=/home/hived/datadir/blockchain \
      -e PG_ACCESS="host    all    all    0.0.0.0/0    trust\nhost    all    all    ::0/0    trust" \
      "${HAF_TEST_IMAGE}" \
      --skip-hived

    # Wait for HAF to be fully initialized (roles + database created)
    # pg_isready is insufficient - it returns success before HAF init scripts complete
    echo "Waiting for HAF initialization..."
    for i in $(seq 1 120); do
      if docker exec haf psql -qt -U haf_admin -d haf_block_log -c "SELECT 1" >/dev/null 2>&1; then
        echo "HAF is ready after ${i}s"
        break
      fi
      if ! docker inspect --format='{{.State.Running}}' haf 2>/dev/null | grep -q true; then
        echo "ERROR: HAF container exited unexpectedly"
        docker logs haf
        exit 1
      fi
      if [ "$i" -eq 120 ]; then
        echo "ERROR: HAF did not become ready within 120s"
        docker logs haf
        exit 1
      fi
      sleep 1
    done
    echo -e "\e[0Ksection_end:$(date +%s):haf\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):install[collapsed=true]\r\e[0KValidating Docker image: install_app..."
    docker run --rm \
      --network nft-test-net \
      -e POSTGRES_HOST=haf \
      "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
      install_app
    echo -e "\e[0Ksection_end:$(date +%s):install\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):regress\r\e[0KRunning regression tests..."
    docker exec -u haf_admin haf mkdir -p /home/haf_admin/workspace
    tar -cf - -C "${CI_PROJECT_DIR}" --exclude=.git . | docker exec -i -u haf_admin haf tar -xf - -C /home/haf_admin/workspace
    docker exec \
      -u haf_admin \
      -w /home/haf_admin \
      haf \
      bash /home/haf_admin/workspace/scripts/ci-helpers/run-ci-tests.sh
    echo -e "\e[0Ksection_end:$(date +%s):regress\r\e[0K"
  after_script:
  - |
    mkdir -p "${CI_PROJECT_DIR}/test-artifacts"
    docker cp "haf:/tmp/nft_tracker/tests/regression/regression.diffs" "${CI_PROJECT_DIR}/test-artifacts/" 2>/dev/null || true
    docker cp "haf:/tmp/nft_tracker/tests/regression/regression.out" "${CI_PROJECT_DIR}/test-artifacts/" 2>/dev/null || true
    docker logs haf > "${CI_PROJECT_DIR}/test-artifacts/haf.log" 2>&1 || true
    docker rm -f haf 2>/dev/null || true
    docker network rm nft-test-net 2>/dev/null || true
  artifacts:
    paths:
    - test-artifacts/
    when: on_failure
    expire_in: 1 week
  tags:
  - public-runner-docker

# Uses .docker_publish_job_template from common-ci-configuration.
# The template re-tags images built with $CI_COMMIT_SHORT_SHA and pushes them
# to both the GitLab registry and registry-upload.hive.blog on protected tags.
publish_images:
  extends: .docker_publish_job_template
  needs:
  - regression_tests
  - build_images
  variables:
    PUBLISH_IMAGES: "nft_tracker postgrest-rewriter"
  tags:
  - public-runner-docker
