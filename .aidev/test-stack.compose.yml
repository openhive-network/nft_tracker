# The service stack AIDEV starts for the slots that install nft_tracker (every suite
# in .aidev/project.yaml without `stack: false`): one HAF PostgreSQL with no hived,
# exactly as CI's regression_tests job starts it — CI's own test image
# (hive/nft_tracker/haf-test:<HAF_VERSION>-v2, built from docker/Dockerfile.test over
# HAF at .gitlab-ci.yml's HAF_VERSION) with `--skip-hived` and trust access from the
# stack network. Nothing is replayed: every test seeds its own mock blocks and
# operations into a database of its own (tests/setup.sql, tests/prelude.sql).
#
# The checks run in the runtime image (.aidev/runtime/), join this stack's network,
# reach the database as `haf` and install the candidate's own SQL, so no nft_tracker
# image is built per change.
#
# Pin: the haf-test tag CI resolves for HAF_VERSION dfbc6e13, as repo:tag@sha256.
# Re-pin it (and the runtime image's FROM) when .gitlab-ci.yml's HAF_VERSION moves
# (.aidev/README.md); the `stack-pins` check fails until both match.
services:
  haf:
    image: registry.gitlab.syncad.com/hive/nft_tracker/haf-test:dfbc6e13-v2@sha256:a540b19306194b1b16e29c42cefe49a1f4b3d2d6afb8e8d72aab04684c14e191
    command: ["--skip-hived"]
    environment:
      DATADIR: /home/hived/datadir
      SHM_DIR: /home/hived/datadir/blockchain
      PGCTLTIMEOUT: "600"
      # Every role from anywhere on the stack network, as CI. Test-grade: the
      # database is throwaway and reachable only on the stack's own network.
      PG_ACCESS: "host    all    all    0.0.0.0/0    trust"
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U haf_admin -d haf_block_log -Atc \"select 1 from pg_extension where extname = 'hive_fork_manager'\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
